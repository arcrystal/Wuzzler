name: Publish Wuzzler beta site

on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'Scripts/export_content_manifest.py'
      - 'Scripts/validate_puzzles.py'
      - 'Wuzzler/Games/**/Puzzles/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and build site
        run: |
          Scripts/validate_puzzles.py --minimum-future-days 30
          mkdir -p _site
          cp Docs/.nojekyll Docs/index.html _site/
          cp -R Docs/assets Docs/privacy Docs/support _site/
          Scripts/export_content_manifest.py \
            --minimum-future-days 30 \
            --output _site/content/v1/puzzles.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
