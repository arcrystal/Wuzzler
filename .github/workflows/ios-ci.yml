name: iOS release gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-archive:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Validate puzzle coverage
        run: |
          python3 -m unittest discover -s Scripts/tests
          Scripts/validate_puzzles.py --minimum-future-days 30
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wuzzler.xcodeproj \
            -scheme Wuzzler \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/WuzzlerTests.xcresult" \
            | tee "$RUNNER_TEMP/test.log"
      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Wuzzler.xcodeproj \
            -scheme Wuzzler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wuzzler.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/archive.log"
      - name: Audit archive
        run: Scripts/audit_release_archive.sh "$RUNNER_TEMP/Wuzzler.xcarchive"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-gate-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/WuzzlerTests.xcresult
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
