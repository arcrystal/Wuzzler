name: iOS release gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-archive:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Install matching iOS Simulator runtime
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -downloadPlatform iOS
          simulator_id=$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )
          candidates = [
              device["udid"]
              for devices in payload["devices"].values()
              for device in devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone Simulator after runtime installation")
          print(candidates[0])
          PY
          )
          echo "WUZ_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Validate puzzle coverage
        run: |
          python3 -m unittest discover -s Scripts/tests
          Scripts/validate_puzzles.py --minimum-future-days 30
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wuzzler.xcodeproj \
            -scheme Wuzzler \
            -destination "platform=iOS Simulator,id=$WUZ_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/WuzzlerTests.xcresult" \
            | tee "$RUNNER_TEMP/test.log"
      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Wuzzler.xcodeproj \
            -scheme Wuzzler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wuzzler.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/archive.log"
      - name: Audit archive
        run: Scripts/audit_release_archive.sh "$RUNNER_TEMP/Wuzzler.xcarchive"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-gate-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/WuzzlerTests.xcresult
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
