name: iOS release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-archive:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 26.6 release baseline
            lane: xcode26-baseline
            runner: macos-26
            xcode: '26.6'
            download_platform: true
            expected_xcode_build: 17F113
            expected_sdk: iphoneos26.5
            advisory: false
          - name: Xcode 27 preview advisory
            lane: xcode27-preview
            runner: xcode-27
            xcode: default
            download_platform: false
            expected_xcode_build: ''
            expected_sdk: ''
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != 'default'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Confirm Xcode 27 preview runner
        if: matrix.lane == 'xcode27-preview'
        run: |
          xcodebuild -version | tee "$RUNNER_TEMP/xcode27-runner-version.log"
          xcodebuild -version | head -1 | grep -Eq '^Xcode 27([.]|$)'

      - name: Run shared release gate
        env:
          WUZZLER_LANE: ${{ matrix.lane }}
          DOWNLOAD_PLATFORM: ${{ matrix.download_platform }}
          EXPECTED_XCODE_BUILD: ${{ matrix.expected_xcode_build }}
          EXPECTED_SDK: ${{ matrix.expected_sdk }}
        run: |
          arguments=(
            --lane "$WUZZLER_LANE"
            --output-dir "$RUNNER_TEMP/release-gate-$WUZZLER_LANE"
          )
          if [[ "$DOWNLOAD_PLATFORM" == "true" ]]; then
            arguments+=(--download-platform)
          fi
          if [[ -n "$EXPECTED_XCODE_BUILD" ]]; then
            arguments+=(--expected-xcode-build "$EXPECTED_XCODE_BUILD")
          fi
          if [[ -n "$EXPECTED_SDK" ]]; then
            arguments+=(--expected-sdk "$EXPECTED_SDK")
          fi
          Scripts/run_release_gate.sh "${arguments[@]}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-gate-${{ matrix.lane }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/xcode27-runner-version.log
            ${{ runner.temp }}/release-gate-${{ matrix.lane }}/*.log
            ${{ runner.temp }}/release-gate-${{ matrix.lane }}/*.xcresult
          if-no-files-found: ignore
